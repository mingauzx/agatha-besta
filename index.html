<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agatha é besta?</title>
<style>
:root{color-scheme:light;--paper:#f9f3e7;--ink:#241b31;--purple:#dcd0ff;--lime:#dfff76;--rule:#30233d;font-family:system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #5b31ac;outline-offset:4px}
header{border-bottom:2px solid var(--rule)}.top{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:20px 28px;font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.top span:last-child{letter-spacing:0;text-transform:none;font-weight:600}
main{max-width:1150px;margin:auto;padding:65px 28px 38px;display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(32px,7vw,100px);align-items:center}
figure{margin:0;position:relative;background:var(--purple);border:2px solid var(--rule);border-radius:18px;padding:13px;box-shadow:8px 8px var(--ink);transform:rotate(-3deg)}
.portrait{background:var(--purple);aspect-ratio:1/1.12;border:2px solid var(--rule);border-radius:9px;overflow:hidden;display:grid;place-items:center}.portrait img{width:100%;height:100%;min-height:0;object-fit:cover;object-position:center 48%}.portrait img[hidden]{display:none}
figcaption{padding:13px 4px 5px;font-family:monospace;font-size:.88rem;font-weight:700}.sticker{position:absolute;right:-17px;top:-20px;background:var(--lime);border:2px solid var(--rule);box-shadow:3px 3px var(--ink);border-radius:50%;width:88px;aspect-ratio:1;display:grid;place-content:center;text-align:center;font-size:.73rem;font-weight:950;transform:rotate(12deg)}
.photo-setup{text-align:center;padding:18px}.photo-setup input{width:100%;margin:14px 0}.photo-setup a{color:#502584}.save-photo{margin:8px 0 4px}
.eyebrow{font:700 .78rem monospace;text-transform:uppercase;letter-spacing:.13em;color:#5a3c79}
h1,h2{margin:10px 0 14px;letter-spacing:-.07em;line-height:.93;font-weight:950}h1{font-size:clamp(3.7rem,8vw,7.1rem)}h1 em{color:#6030a3;font-style:normal}h2{font-size:clamp(2.1rem,5vw,4.1rem)}
p{line-height:1.55;max-width:43ch}.intro{font-size:1.12rem;margin-bottom:26px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.btn,.choice{border:2px solid var(--rule);border-radius:9px;padding:13px 17px;font-weight:800;background:var(--lime);color:var(--ink);box-shadow:4px 4px var(--ink);transition:transform .15s,box-shadow .15s}.btn:hover,.choice:hover{transform:translate(-2px,-2px);box-shadow:6px 6px var(--ink)}.btn:active,.choice:active{transform:translate(3px,3px);box-shadow:1px 1px var(--ink)}.secondary,.choice{background:var(--paper)}.choice:hover{background:var(--purple)}
.choices{display:grid;gap:12px;margin-top:22px}.choice{text-align:left}.meter{width:100%;height:14px;accent-color:#6030a3;margin:10px 0}.score{font-size:clamp(3.4rem,8vw,6rem);font-weight:950;letter-spacing:-.08em;color:#6030a3;line-height:1}
footer{max-width:1150px;margin:auto;padding:20px 28px 28px;font: .87rem monospace;color:#594b64}.status{font-size:.9rem}textarea{width:100%;min-height:70px;margin-top:8px;padding:10px;border:2px solid var(--rule);border-radius:8px;background:white;color:var(--ink)}
@media(max-width:680px){.top{padding:16px 22px}main{grid-template-columns:1fr;gap:38px;padding:32px 24px 20px}figure{max-width:340px;width:90%;margin:auto}.portrait{aspect-ratio:1.2}h1{font-size:clamp(3.5rem,13vw,6rem)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <div class="photo-setup" id="photoSetup" hidden="">
        <label for="photoFile"><strong>Coloque a foto da live</strong></label>
        <input type="file" id="photoFile" accept="image/png,image/jpeg,image/webp">
        <a href="https://chatgpt.com/api/library/files/libfile_0956cb5b87008191b22d97ee1f80a7a0/download">Baixar a foto enviada</a>
        <p id="photoStatus" role="status"></p>
      </div>
    </div>
    <span class="sticker" aria-hidden="true">AO VIVO<br>KKKK</span>
    <figcaption>A cara de quem virou pauta.</figcaption>
    <button class="btn secondary save-photo" id="savePhoto" hidden="">Baixar site com a foto</button>
  </figure>
  <section id="panel" aria-label="Teste da resenha">
    <div id="intro">
      <span class="eyebrow">O teste da resenha</span>
      <h1>Agatha é<br><em>besta?</em></h1>
      <p class="intro">Três perguntas pra descobrir o quanto a Agatha transforma qualquer momento em resenha.</p>
      <button class="btn" id="start">Começar o teste →</button>
    </div>
    <div id="quiz" hidden="">
      <p id="step" class="eyebrow"></p>
      <progress class="meter" id="progress" max="3" aria-label="Progresso do teste"></progress>
      <h2 id="question" tabindex="-1"></h2>
      <div class="choices" id="choices"></div>
    </div>
    <div id="result" hidden="">
      <span class="eyebrow">Resultado da resenha</span>
      <div class="score" id="score"></div>
      <h2 id="verdict" tabindex="-1"></h2>
      <p id="summary"></p>
      <div class="actions"><button class="btn" id="copy">Copiar resultado</button><button class="btn secondary" id="restart">Jogar de novo</button></div>
      <p id="status" class="status" role="status"></p>
      <textarea id="manual" aria-label="Resultado para copiar" readonly="" hidden=""></textarea>
    </div>
  </section>
</main>
<footer>Feito na amizade. Valeu pela resenha, Agatha 💜</footer>
<script>
const questions = [
  ['O que a Agatha faz quando bate o silêncio?', ['Deixa o silêncio reinar', 'Solta um “ué” do nada', 'Faz o grupo inteiro rir']],
  ['Se mandarem “olha a câmera”, ela…', ['Olha normalmente', 'Faz pose por dois segundos', 'Já entrega uma figurinha']],
  ['Qual a chance de uma live virar meme?', ['Só se der sorte', 'Depende do humor do chat', 'Já virou antes de começar']]
];
const get = id => document.getElementById(id);
const initialPage = document.documentElement.cloneNode(true);
const photo = get('photo');
get('photoFile').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const canvas = document.createElement('canvas');
    const scale = Math.min(1, 780 / image.naturalWidth);
    canvas.width = Math.round(image.naturalWidth * scale);
    canvas.height = Math.round(image.naturalHeight * scale);
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    photo.src = canvas.toDataURL('image/jpeg', 0.87);
    photo.hidden = false;
    get('photoSetup').hidden = true;
    get('savePhoto').hidden = false;
  } catch {
    get('photoStatus').textContent = 'Não consegui abrir essa imagem. Escolha um PNG, JPG ou WebP.';
  } finally {
    URL.revokeObjectURL(url);
  }
});
get('savePhoto').addEventListener('click', () => {
  const page = initialPage.cloneNode(true);
  const embedded = page.querySelector('#photo');
  embedded.src = photo.src;
  embedded.hidden = false;
  page.querySelector('#photoSetup').hidden = true;
  const html = new Blob(['<!doctype html>\n', page.outerHTML], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(html);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'index.html';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
let index = 0;
let points = 0;
let shareText = '';

function nextQuestion() {
  const [question, answers] = questions[index];
  get('step').textContent = 'Pergunta ' + (index + 1) + ' de ' + questions.length;
  get('progress').value = index + 1;
  get('question').textContent = question;
  const options = answers.map((answer, score) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'choice';
    button.textContent = answer;
    button.addEventListener('click', () => {
      points += score;
      index++;
      if (index === questions.length) showResult();
      else nextQuestion();
    });
    return button;
  });
  get('choices').replaceChildren(...options);
  get('question').focus();
}

function start() {
  index = 0;
  points = 0;
  get('intro').hidden = true;
  get('result').hidden = true;
  get('quiz').hidden = false;
  get('manual').hidden = true;
  get('status').textContent = '';
  nextQuestion();
}

function showResult() {
  const percentage = Math.round(points / (questions.length * 2) * 100);
  const verdict = percentage < 34 ? 'Resenha em modo silencioso' : percentage < 67 ? 'Resenha de respeito' : 'Besta com certificado';
  const summary = percentage < 34 ? 'O chat ainda está esperando o primeiro “KKKK”.' : percentage < 67 ? 'Bastou uma frase e o chat já perdeu a linha.' : 'Uma live, três figurinhas e nenhum momento de paz no chat.';
  get('score').textContent = percentage + '%';
  get('verdict').textContent = verdict;
  get('summary').textContent = summary;
  shareText = 'Agatha é besta? ' + percentage + '% de resenha 😭\n' + verdict + '. ' + summary;
  get('quiz').hidden = true;
  get('result').hidden = false;
  get('verdict').focus();
}

get('start').addEventListener('click', start);
get('restart').addEventListener('click', start);
get('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(shareText);
    get('status').textContent = 'Resultado copiado!';
  } catch {
    const manual = get('manual');
    manual.value = shareText;
    manual.hidden = false;
    manual.focus();
    manual.select();
    get('status').textContent = 'O resultado está selecionado para você copiar.';
  }
});
</script></body></html>
